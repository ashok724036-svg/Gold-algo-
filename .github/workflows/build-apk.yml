name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Prepare signing key
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/android/app
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/release.jks
          else
            keytool -genkeypair -v -keystore app/android/app/release.jks \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug"
          fi
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name goldscalper_pro .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze and test
        run: flutter analyze && flutter test
      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goldscalper-pro-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk