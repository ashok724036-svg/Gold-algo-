name: goldscalper_pro
description: Offline-capable XAUUSD paper trading bot platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  drift: ^2.18.0
  fl_chart: ^0.68.0
  file_picker: ^8.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

dependency_overrides:
  # 6.4.1 references Flutter's Gradle extension and breaks the Flutter 3.24
  # plugin loader. 6.4.0 uses a standalone Android library configuration.
  app_links: 6.4.0

flutter:
  uses-material-design: true