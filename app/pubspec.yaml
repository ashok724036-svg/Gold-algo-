publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  fl_chart: ^0.68.0
  candlesticks: ^2.1.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  file_picker: ^8.0.6
  csv: ^6.0.0
  pdf: ^3.11.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true